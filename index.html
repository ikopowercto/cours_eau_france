<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Carte interactive • Cours d’eau Sandre ETH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    html, body {
      margin:0; padding:0; height:100%;
    }
    #map { width:100%; height:100%; }
    .leaflet-popup-content {
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Initialisation de la carte
    var map = L.map('map').setView([46.5, 2], 6); // centrée sur France

    // Fond OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: "© OpenStreetMap"
    }).addTo(map);

    // URL WFS ETH Cours d'eau (GeoJSON)
    const urlETH = "https://services.sandre.eaufrance.fr/geo/eth?" +
                   "service=WFS&version=2.0.0&request=GetFeature&" +
                   "typenames=sa:CoursEau&" +
                   "srsName=EPSG:4326&" +
                   "outputFormat=application/json%3B%20subtype=geojson";

    // Style simple pour dessin cours d'eau
    function styleCours() {
      return { color: "blue", weight: 1 };
    }

    // Popup avec code + nom
    function popupCours(feature, layer) {
      let p = feature.properties;
      let contenu = `
        <b>Code : </b>${p.CdEntiteHydrographique || "?"}<br/>
        <b>Nom  : </b>${p.NomEntiteHydrographique || "?"}
      `;
      layer.bindPopup(contenu);
    }

    // Charger et afficher ETH
    fetch(urlETH)
      .then(r => r.json())
      .then(data => {
        L.geoJSON(data, {
          style: styleCours,
          onEachFeature: popupCours
        }).addTo(map);
        console.log("Entités ETH chargées :", data);
      })
      .catch(err => console.error("Erreur WFS ETH :", err));
  </script>
</body>
</html>
