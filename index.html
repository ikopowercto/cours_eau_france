<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Carte interactive • Cours d’eau Sandre ETH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    html, body { margin:0; padding:0; height:100%; }
    #map { width:100%; height:100%; }
    .leaflet-popup-content { font-family: Arial, sans-serif; font-size: 13px; line-height: 1.4; }

    /* Message overlay */
    #message {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff8dc;
      border: 1px solid #f0e68c;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1200;
    }
    .loader {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #555;
      border-radius: 50%;
      width: 12px;
      height: 12px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }
  </style>
</head>
<body>
  <div id="map"></div>
  <!-- Overlay message -->
  <div id="message"><div class="loader"></div> ⏳ Chargement des cours d’eau depuis le Sandre...</div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Initialiser la carte
    var map = L.map('map').setView([46.5, 2], 6);

    // Fond cartographique
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: "© OpenStreetMap"
    }).addTo(map);

    // URL ETH
    const urlETH = "https://services.sandre.eaufrance.fr/geo/eth?" +
                   "service=WFS&version=2.0.0&request=GetFeature&" +
                   "typenames=sa:CoursEau&" +
                   "srsName=EPSG:4326&" +
                   "outputFormat=application/json%3B%20subtype=geojson";

    // Style cours d'eau
    function styleCours() { return { color: "blue", weight: 1 }; }

    // Popup
    function popupCours(feature, layer) {
      let p = feature.properties;
      layer.bindPopup(`<b>Code : </b>${p.CdEntiteHydrographique || "?"}<br/>
                       <b>Nom  : </b>${p.NomEntiteHydrographique || "?"}`);
    }

    // Message overlay
    const messageDiv = document.getElementById("message");

    // Téléchargement des données
    fetch(urlETH)
      .then(r => r.json())
      .then(data => {
        L.geoJSON(data, {
          style: styleCours,
          onEachFeature: popupCours
        }).addTo(map);

        // Mise à jour du message (succès)
        messageDiv.innerHTML = "✅ Cours d’eau chargés avec succès";
        messageDiv.style.background = "#e6ffe6";
        messageDiv.style.border = "1px solid #7cfc00";
        messageDiv.style.color = "darkgreen";

        // Faire disparaître le message après 3 secondes
        setTimeout(() => messageDiv.style.display = "none", 3000);
      })
      .catch(err => {
        console.error("Erreur WFS ETH:", err);
        messageDiv.innerHTML = "⚠️ Erreur de chargement des cours d’eau";
        messageDiv.style.background = "#ffe6e6";
        messageDiv.style.border = "1px solid #ff4d4d";
        messageDiv.style.color = "darkred";
      });
  </script>
</body>
</html>
