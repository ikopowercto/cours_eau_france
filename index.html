<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Cours d’eau TOPOAGE 2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    html, body {margin:0; height:100%;}
    #map {height:100%; width:100%;}
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([47.8,3.3], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18, attribution:"© OpenStreetMap"
    }).addTo(map);

    // BBOX Yonne pour test
    const urlTopo = "https://services.sandre.eaufrance.fr/geo/topage2024?" +
      "service=WFS&version=2.0.0&request=GetFeature&" +
      "typenames=sa:CoursEau&" + 
      "srsName=EPSG:4326&" +
      "bbox=2.9,47.6,3.8,48.3,EPSG:4326&" + 
      "outputFormat=application/json%3B%20subtype=geojson";

    console.log("Appel WFS:", urlTopo);

    fetch(urlTopo)
      .then(r=>{
        console.log("Réponse brute:", r);
        return r.json();
      })
      .then(data=>{
        console.log("Features reçues:", data.features ? data.features.length : "pas de features");
        L.geoJSON(data, {
          style: {color:"blue", weight:1},
          onEachFeature: (f,l)=>{
            let p=f.properties;
            l.bindPopup(`<b>Code :</b> ${p.CdEntiteHydrographique||"?"}<br/>
                         <b>Nom :</b> ${p.NomEntiteHydrographique||"?"}`);
          }
        }).addTo(map);
      })
      .catch(e=>{
        console.error("Erreur chargement TOPOAGE:", e);
        alert("Erreur de chargement TOPOAGE, voir console");
      });
  </script>
</body>
</html>
