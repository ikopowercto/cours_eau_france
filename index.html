<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Carte interactive • Cours d’eau Sandre ETH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    :root {
      --primary: #0077cc;
      --success: #28a745;
      --error: #dc3545;
      --light-bg: #f8f9fa;
    }

    html, body {
      margin:0; padding:0; height:100%; 
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--light-bg);
      display: flex;
      flex-direction: column;
    }

    /* Header moderne */
    .header {
      text-align: center;
      background: white;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header img {
      height: 55px;
      margin-bottom: 8px;
    }
    .header h1 {
      margin: 0;
      font-size: 22px;
      color: #2c3e50;
    }
    .header p {
      margin: 5px 0 15px;
      color: #666;
      font-size: 14px;
    }

    /* Barre de saisie moderne */
    .coords-form {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
    }
    .coords-form input {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 220px;
      transition: border .2s;
    }
    .coords-form input:focus {
      border-color: var(--primary);
      outline: none;
    }
    .coords-form button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s;
    }
    .coords-form button:hover { background: #005fa3; }

    /* Carte avec effet moderne */
    #map {
      flex: 1;
      margin: 15px auto;
      width: 92%;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      position: relative;
    }

    /* Message overlay style moderne */
    #message {
      position:absolute; top:15px; left:50%; transform:translateX(-50%);
      background:#fff;
      border-radius:4px;
      padding:10px 14px;
      font-size:14px;
      box-shadow:0 2px 8px rgba(0,0,0,0.2);
      display:flex; align-items:center; gap:10px;
      z-index:1200;
    }
    .loader {
      border:3px solid #f3f3f3;
      border-top:3px solid var(--primary);
      border-radius:50%;
      width:14px; height:14px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

    /* Footer */
    footer {
      text-align:center;
      background: white;
      padding: 8px;
      font-size: 13px;
      color:#666;
      border-top:1px solid #ddd;
    }
  </style>
</head>
<body>
  <!-- Header moderne -->
  <div class="header">
    <img src="https://ikopower.fr/wp-content/uploads/2021/11/iko-power_logo_turbine-hydroelectrique.png" alt="Logo IKO Power"/>
    <h1>Carte interactive • Cours d’eau (Sandre ETH)</h1>
    <p>Cliquez sur un cours d’eau pour voir son code et son nom officiel</p>
    <div class="coords-form">
      <input type="text" id="coords" placeholder="Ex: 47.0, 3.5">
      <button onclick="goToCoords()">Aller</button>
    </div>
  </div>

  <!-- Carte Leaflet -->
  <div id="map">
    <div id="message"><div class="loader"></div> ⏳ Chargement des cours d’eau...</div>
  </div>

  <!-- Footer -->
  <footer>© 2025 IKO Power • Carte interactive client</footer>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([46.5,2], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:18,
      attribution:"© OpenStreetMap"
    }).addTo(map);

    // URL -> ⚠️ Très lourd sans filtre
    const urlETH = "https://services.sandre.eaufrance.fr/geo/eth?" +
                   "service=WFS&version=2.0.0&request=GetFeature&" +
                   "typenames=sa:CoursEau&" +
                   "srsName=EPSG:4326&" +
                   "outputFormat=application/json%3B%20subtype=geojson";

    function styleCours(){ return {color:"blue", weight:1}; }
    function popupCours(feature, layer){
      let p=feature.properties;
      layer.bindPopup(`<b>Code :</b> ${p.CdEntiteHydrographique||"?"}<br/>
                       <b>Nom :</b> ${p.NomEntiteHydrographique||"?"}`);
    }

    const messageDiv=document.getElementById("message");

    // Charger données SANDRE
    fetch(urlETH).then(r=>r.json()).then(data=>{
      L.geoJSON(data,{style:styleCours,onEachFeature:popupCours}).addTo(map);

      // Succès
      messageDiv.innerHTML="✅ Données chargées";
      messageDiv.style.background="#e6ffe6";
      messageDiv.style.color="var(--success)";
      setTimeout(()=>messageDiv.style.display="none",3000);
    }).catch(err=>{
      console.error("Erreur WFS ETH:",err);
      messageDiv.innerHTML="⚠️ Erreur de chargement";
      messageDiv.style.background="#ffe6e6";
      messageDiv.style.color="var(--error)";
    });

    // Aller aux coordonnées
    function goToCoords(){
      let input=document.getElementById("coords").value.trim();
      if(!input){ alert("Saisir coordonnées (lat, lon)"); return;}
      let parts=input.split(/[,; ]+/);
      if(parts.length<2){ alert("Format: 47.0, 3.5"); return;}
      let lat=parseFloat(parts[0]), lon=parseFloat(parts[1]);
      if(isNaN(lat)||isNaN(lon)){ alert("Coordonnées invalides"); return;}
      map.setView([lat,lon],12);
      L.popup().setLatLng([lat,lon]).setContent("📍 Zoom ici").openOn(map);
    }
  </script>
</body>
</html>
